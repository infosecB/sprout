name: Sprout

options:
  bundleIdPrefix: com.brendanchamberlain
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # The Apple developer team that signs the app and its extension.
    DEVELOPMENT_TEAM: J8NN2U3KPV
    CODE_SIGN_STYLE: Automatic
    # The version users see. Release builds take it from the git tag (ci_scripts/ci_post_clone.sh),
    # so don't bump it by hand. There must be exactly one MARKETING_VERSION line in this file.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The widget extension's identifier and the App Group are made from this.
    APP_BUNDLE_IDENTIFIER: com.brendanchamberlain.sprout
    APP_GROUP_IDENTIFIER: group.$(APP_BUNDLE_IDENTIFIER)
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Sprout:
    type: application
    platform: iOS
    sources:
      - path: Sprout
        excludes:
          - PrivacyInfo.xcprivacy
      # Apple's privacy manifest (required because the app uses UserDefaults).
      - path: Sprout/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Code the widget extension compiles too.
      - path: Shared
    dependencies:
      - target: SproutWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        # Merged with the generated keys: the URL scheme and the App Group name, which have no
        # INFOPLIST_KEY_ settings.
        INFOPLIST_FILE: Config/Sprout-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Sprout.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Sprout
        # Only the encryption built into iOS, so App Store Connect doesn't ask on each upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  # Home Screen / Lock Screen widgets and the iOS 18 control.
  SproutWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SproutWidgets
        excludes:
          - PrivacyInfo.xcprivacy
      - path: SproutWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/SproutWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/SproutWidgets.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Sprout
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  SproutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SproutTests
      # For StoreKitTest's SKTestSession.
      - path: Sprout.storekit
        buildPhase: resources
    dependencies:
      - target: Sprout
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sprout:
    build:
      targets:
        Sprout: all
    run:
      # Runs from Xcode buy Pro from this local file instead of the App Store, so purchases work
      # without App Store Connect. TestFlight and App Store builds always use the App Store.
      storeKitConfiguration: Sprout.storekit
    test:
      targets:
        - SproutTests
    archive:
      config: Release
